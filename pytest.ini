[pytest]
# Test discovery
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output and reporting
addopts = 
    -v                                      # verbose
    --strict-markers
    --strict-config
    --tb=short
    --cov=surfa
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml
    --cov-config=.coveragerc

# Markers for test categorization
markers =
    unit: Unit tests - fast, isolated tests with no I/O (deselect with '-m "not unit"')
    integration: Integration tests - test multiple components together
    slow: Slow tests - tests that take more than 5 seconds
    io: I/O tests - tests involving file system operations
    mesh: Mesh-related tests - tests for mesh data structures and operations
    transform: Transformation tests - tests for affine and warp transformations
    geometry: Geometry tests - tests for spatial geometry operations
    labels: Label tests - tests for label/segmentation operations

# Coverage
[coverage:run]
source = surfa
omit = 
    */test/*
    */tests/*
    */__pycache__/*

# Warning settings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Test collection settings
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .cache

# Console output
console_output_style = progress

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Minimum Python version
minversion = 3.8